services:
  - type: web
    name: ecombharat-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        # After Vercel deploy, update this to include your Vercel URL:
        # value: http://localhost:5173,https://ecombharat.vercel.app
        value: http://localhost:5173
    healthCheckPath: /health
    autoDeploy: true
    region: singapore
